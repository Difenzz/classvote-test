<!DOCTYPE html>
<html lang="fr">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="robots" content="noindex">
        <title>Page introuvable · ClassVote</title>

        <script>
            (function () {
                var m = document.cookie.match(/(?:^|; )cv_theme=(light|dark)/);
                var dark = m ? m[1] === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
                document.documentElement.dataset.theme = dark ? "dark" : "light";
            })();
        </script>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Caveat:wght@700&family=Source+Sans+3:wght@400;600;700&display=swap">

        <!-- Page autonome : elle doit s'afficher quel que soit le chemin demandé -->
        <style>
            :root {
                color-scheme: light;
                --bg: #F7F8FB; --surface: #fff; --ink: #1D2440; --ink-2: #596080; --line: #98A1C4;
                --blue: #2438A6; --blue-dark: #182778; --on-blue: #fff; --red: #C8372A;
                --seyes-1: rgba(70, 90, 185, .13); --seyes-2: rgba(70, 90, 185, .06); --margin: rgba(200, 55, 42, .38);
                --display: "Bitter", Georgia, "Times New Roman", serif;
                --text: "Source Sans 3", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            }
            :root[data-theme="dark"] {
                color-scheme: dark;
                --bg: #1B2226; --surface: #242D32; --ink: #ECEAE2; --ink-2: #A8B0B0; --line: #5A676D;
                --blue: #8DB2FF; --blue-dark: #B0C9FF; --on-blue: #14191C; --red: #FF8B7B;
                --seyes-1: rgba(200, 215, 230, .075); --seyes-2: rgba(200, 215, 230, .03); --margin: rgba(255, 139, 123, .3);
            }
            * { box-sizing: border-box; }
            body {
                margin: 0; min-height: 100dvh; display: grid; grid-template-rows: 1fr auto;
                background-color: var(--bg);
                background-image:
                    linear-gradient(var(--seyes-1) 1px, transparent 1px),
                    linear-gradient(90deg, var(--seyes-1) 1px, transparent 1px),
                    linear-gradient(var(--seyes-2) 1px, transparent 1px);
                background-size: 32px 32px, 32px 32px, 32px 8px;
                color: var(--ink); font: 400 17px/1.5 var(--text);
            }
            body::before {
                content: ""; position: fixed; top: 0; bottom: 0; left: max(6px, calc(50% - 524px));
                z-index: -1; width: 2px; background: var(--margin);
            }
            main { display: grid; place-items: center; padding: 24px 16px; }
            .card {
                width: 100%; max-width: 480px; padding: clamp(24px, 6vw, 40px); text-align: center;
                background: var(--surface); border: 1.5px solid var(--line); border-radius: 6px;
            }
            .num { font: 700 clamp(100px, 26vw, 150px)/.9 var(--display); color: var(--blue); }
            .stamp {
                display: inline-block; margin: 8px 0 16px; padding: 4px 14px; border: 3px solid var(--red);
                border-radius: 4px; color: var(--red); font: 700 24px/1.1 var(--display);
                letter-spacing: .04em; text-transform: uppercase; transform: rotate(-5deg);
            }
            h1 { margin: 0 0 6px; font: 700 clamp(26px, 6vw, 34px)/1.15 var(--display); }
            p { margin: 0 0 22px; color: var(--ink-2); }
            .btn {
                display: inline-block; padding: 12px 22px; border-radius: 5px; background: var(--blue);
                color: var(--on-blue); font-weight: 700; text-decoration: none;
            }
            .btn:hover { background: var(--blue-dark); }
            .btn:focus-visible, a:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
            footer {
                padding: 20px 16px calc(24px + env(safe-area-inset-bottom)); text-align: center;
                background: var(--surface); border-top: 2px solid var(--ink); color: var(--ink-2); font-size: 14px;
            }
            footer a { color: var(--ink); font-weight: 600; margin: 0 8px; }
        </style>
    </head>

    <body>
        <main>
            <section class="card">
                <div class="num" aria-hidden="true">404</div>
                <span class="stamp">Bulletin nul</span>
                <h1>Page introuvable</h1>
                <p>Cette page n'existe pas ou a été déplacée.</p>
                <a class="btn" id="home" href="/">Retour à l'accueil</a>
            </section>
        </main>

        <footer>
            <a id="l1" href="/#/mentions-legales">Mentions légales</a>
            <a id="l2" href="/#/cgu">CGU</a>
            <a id="l3" href="/#/cookies">Cookies</a>
            <p style="margin:10px 0 0">© 2026 Enzo Perdu et Emerick Woiret. Tous droits réservés.</p>
        </footer>

        <script>
            /* Sur GitHub Pages (site de projet), la racine est /nom-du-depot/ */
            var seg = location.pathname.split("/")[1];
            var base = location.hostname.slice(-10) === ".github.io" && seg ? "/" + seg + "/" : "/";
            document.getElementById("home").href = base;
            document.getElementById("l1").href = base + "#/mentions-legales";
            document.getElementById("l2").href = base + "#/cgu";
            document.getElementById("l3").href = base + "#/cookies";
        </script>
    </body>

</html>
