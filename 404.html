            .logo {
                display: block; width: 52px; height: 60px; margin: 0 auto 10px; background: var(--blue);
                -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat;
            }
            * { box-sizing: border-box; }
            body {
                margin: 0; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto;
                background: radial-gradient(900px 420px at 50% -140px, color-mix(in srgb, var(--blue) 9%, transparent), transparent 70%), var(--bg);
                background-repeat: no-repeat; color: var(--ink); font: 400 16px/1.55 var(--text);
            }
            .stripe { height: 3px; background: linear-gradient(90deg, var(--press), var(--blue) 55%, var(--sky)); }
            main { display: grid; place-items: center; padding: 24px 16px; }
            .card {
                width: 100%; max-width: 480px; padding: clamp(24px, 6vw, 40px); text-align: center;
                background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
                box-shadow: 0 1px 2px rgba(37, 48, 75, .05), 0 12px 26px -16px rgba(37, 48, 75, .22);
            }
            .num { font: 600 clamp(110px, 30vw, 170px)/.9 var(--display); color: var(--blue); }
            .stamp {
                display: inline-block; margin: 6px 0 14px; padding: 4px 16px; border: 2.5px solid var(--blue);
                border-radius: 10px; color: var(--blue); font: 600 24px/1.1 var(--display);
                letter-spacing: .04em; opacity: .9; transform: rotate(-5deg);
            }
            h1 { margin: 0 0 8px; font: 600 clamp(30px, 6.4vw, 40px)/1.1 var(--display); letter-spacing: -.02em; }
            p { margin: 0 0 22px; color: var(--ink-2); }
            .btn {
                display: inline-block; padding: 12px 22px; border-radius: 12px; background: var(--blue);
                color: var(--on-blue); font-weight: 600; text-decoration: none;
                box-shadow: 0 8px 18px -10px color-mix(in srgb, var(--blue) 75%, transparent);
            }
            .btn:hover { background: var(--blue-dark); }
            .btn:focus-visible, a:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
            footer { padding: 20px 16px calc(24px + env(safe-area-inset-bottom)); text-align: center; color: var(--ink-2); font-size: 14px; }
            footer a { color: var(--ink); font-weight: 600; margin: 0 8px; }
        </style>
    </head>

    <body>
        <div class="stripe"></div>

        <main>
            <section class="card">
                <span class="logo" aria-hidden="true"></span>
                <div class="num" aria-hidden="true">404</div>
                <span class="stamp">Bulletin nul</span>
                <h1>Page introuvable</h1>
                <p>Cette page n'existe pas ou a été déplacée.</p>
                <a class="btn" id="home" href="/">Retour à l'accueil</a>
            </section>
        </main>

        <footer>
            <a id="l1" href="/#/mentions-legales">Mentions légales</a>
            <a id="l2" href="/#/cgu">CGU</a>
            <a id="l3" href="/#/cookies">Cookies</a>
            <p style="margin:10px 0 0">© 2026 Enzo Perdu et Emerick Woiret. Tous droits réservés.</p>
        </footer>

        <script>
            /* Sur GitHub Pages (site de projet), la racine est /nom-du-depot/ */
            var seg = location.pathname.split("/")[1];
            var base = location.hostname.slice(-10) === ".github.io" && seg ? "/" + seg + "/" : "/";
            document.getElementById("home").href = base;
            document.getElementById("l1").href = base + "#/mentions-legales";
            document.getElementById("l2").href = base + "#/cgu";
            document.getElementById("l3").href = base + "#/cookies";
        </script>
    </body>
