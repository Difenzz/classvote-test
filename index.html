<!DOCTYPE html>
<html lang="fr">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="description" content="Élection des délégués de classe : candidatures en binôme, vote anonyme, podium.">
        <meta name="theme-color" content="#F2F4F9">

        <title>Élection des délégués</title>

        <!-- Applique le thème avant l'affichage (évite le flash blanc) -->
        <script>
            (function () {
                var m = document.cookie.match(/(?:^|; )cv_theme=(light|dark)/);
                var dark = m ? m[1] === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
                document.documentElement.dataset.theme = dark ? "dark" : "light";
            })();
        </script>

        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%B3%EF%B8%8F%3C/text%3E%3C/svg%3E">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Public+Sans:wght@400;600;700&display=swap">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <a class="skip" href="#app">Aller au contenu</a>

        <header class="topbar">
            <div class="topbar-in">

                <a class="brand" href="./" onclick="event.preventDefault(); closePage(); go(prof ? 'dash' : 'home')" aria-label="ClassVote, accueil">
                    <svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="14" width="24" height="14" rx="3" fill="var(--blue)" stroke="var(--blue)"/>
                        <path d="M11 14V9.5M21 14V9.5" stroke="var(--ink)"/>
                        <path d="M9 9.5l7-5.5 7 5.5z" fill="var(--red)" stroke="var(--red)"/>
                        <path d="M12 21h8" stroke="var(--on-blue)"/>
                    </svg>
                    ClassVote
                </a>

                <button id="theme-btn" class="icon-btn" onclick="toggleTheme()" aria-label="Passer en mode sombre">
                    <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                    <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                </button>

            </div>
        </header>

        <main id="app" aria-live="polite"></main>

        <noscript>
            <p class="noscript">Need js to work :p </p>
        </noscript>

        <footer class="footer">
            <nav aria-label="Informations légales">
                <a href="#/mentions-legales">Mentions légales</a>
                <a href="#/cgu">CGU</a>
                <a href="#/cookies">Cookies et données</a>
                <button type="button" class="link" onclick="showConsent(true)">Gérer les cookies</button>
            </nav>
            <p>© 2026 Enzo Perdu et Emerick Woiret. Tous droits réservés.</p>
        </footer>

        <div id="consent-root"></div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" defer></script>
        <script src="script.js" defer></script>

    </body>

</html>
